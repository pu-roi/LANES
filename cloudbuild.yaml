options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'

steps:
  # 1. Build the container image from the backend directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'backend'

  # Test the built runtime before publishing or changing any cloud resource.
  # Test tooling is installed only in this disposable verification container.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - '-e'
      - 'ENVIRONMENT=development'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - 'sh'
      - '-c'
      - >-
        pip install --no-cache-dir pytest==8.2.2 pytest-asyncio==0.23.7 &&
        python -m pytest tests/test_news_source_validation.py
        tests/test_production_signing_key.py tests/test_news_claim_auditor.py
        tests/test_news_batch_audit.py tests/test_news_evaluation.py
        tests/test_news_automation.py tests/test_news_publication_lifecycle.py
        tests/test_news_estimated_road.py tests/test_news_pipeline.py
        tests/test_news_weather.py tests/test_news_collection_cadence.py
        tests/test_news_reader_release.py tests/test_news_results.py tests/test_news_verification_presentation.py tests/test_news_philstar_pins.py tests/test_spatial_browse.py
        tests/test_news_tribune_pilot.py tests/test_news_tribune_replay.py tests/test_news_philstar_pilot.py tests/test_news_native_group_route.py tests/test_news_junction_estimate.py tests/test_news_reviewed_corner.py --confcutdir=tests -q -p no:cacheprovider

  # Required real PostgreSQL/JSONB gate; the script owns an isolated container
  # and removes it on success or failure. No application database credentials.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - 'backend/scripts/check_history_media_ci.sh'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'

  # 2. Push the image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'

  # 3. Update & execute database migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-migration'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'lanes-migration'
      - '--wait'
      - '--region'
      - 'asia-east1'

  # API releases must prove saved-reader compatibility before receiving traffic.
  # Worker deployment/discovery is deliberately independent: a release never
  # invokes RSS processing or overwrites the qualified manual-worker resources.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'python3'
    args:
      - 'backend/scripts/deploy_api_checked.py'
      - '--project=$PROJECT_ID'
      - '--region=asia-east1'
      - '--service=lanes-api'
      - '--image=gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--suffix=build-$BUILD_ID'

images:
  - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
