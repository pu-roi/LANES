options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build the container image from the backend directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'backend'

  # Test the built runtime before publishing or changing any cloud resource.
  # Test tooling is installed only in this disposable verification container.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - '-e'
      - 'ENVIRONMENT=development'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - 'sh'
      - '-c'
      - >-
        pip install --no-cache-dir pytest==8.2.2 pytest-asyncio==0.23.7 &&
        python -m pytest tests/test_news_source_validation.py
        tests/test_production_signing_key.py tests/test_news_claim_auditor.py
        tests/test_news_batch_audit.py tests/test_news_evaluation.py
        tests/test_news_automation.py tests/test_news_publication_lifecycle.py
        tests/test_news_estimated_road.py tests/test_news_pipeline.py
        tests/test_news_weather.py tests/test_news_collection_cadence.py --confcutdir=tests -q -p no:cacheprovider

  # 2. Push the image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'

  # 3. Update & execute database migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-migration'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'lanes-migration'
      - '--wait'
      - '--region'
      - 'asia-east1'

  # 4. Prepare this build's API revision without changing serving traffic yet.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lanes-api'
      - '--no-traffic'
      - '--revision-suffix=build-$BUILD_ID'
      - '--min=1'
      - '--update-env-vars=LANES_NEWS_AUDITOR_PROVIDER=source_rules,LANES_NEWS_AUDITOR_MODEL=source-rules-v1,LANES_NEWS_AUDITOR_CONFIG_REVISION=source-rules-production-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  # 5. Automatically deploy the new image to news discovery Cloud Run job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-news-discovery'
      - '--memory=1Gi'
      - '--command=python'
      - '--args=-m,scripts.run_news_discovery,--discover,--pipeline,--scheduled,--limit,50'
      - '--update-env-vars=LANES_NEWS_AUDITOR_PROVIDER=source_rules,LANES_NEWS_AUDITOR_MODEL=source-rules-v1,LANES_NEWS_AUDITOR_CONFIG_REVISION=source-rules-production-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  # Keep the independent expiry worker on the same API/model image.
  # Its existing database binding and minute scheduler are provisioned separately.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-zone-expiry'
      - '--memory=1Gi'
      - '--command=python'
      - '--args=-m,scripts.run_zone_expiry'
      - '--update-env-vars=LANES_NEWS_AUDITOR_PROVIDER=source_rules,LANES_NEWS_AUDITOR_MODEL=source-rules-v1,LANES_NEWS_AUDITOR_CONFIG_REVISION=source-rules-production-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  # Require a real successful source-mode worker execution before API promotion.
  # The existing advisory lock handles concurrent scheduled worker attempts.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'lanes-news-discovery'
      - '--wait'
      - '--region'
      - 'asia-east1'

  # Promote the exact revision only after tests, migrations and worker success.
  # Explicit promotion also clears traffic pinned by an earlier manual rollback.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'lanes-api'
      - '--to-revisions=lanes-api-build-$BUILD_ID=100'
      - '--region'
      - 'asia-east1'

images:
  - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
