options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build the container image from the backend directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'backend'

  # 2. Push the image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'

  # 3. Update & execute database migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-migration'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'lanes-migration'
      - '--wait'
      - '--region'
      - 'asia-east1'

  # 4. Prepare this build's API revision without changing serving traffic yet.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lanes-api'
      - '--no-traffic'
      - '--revision-suffix=build-$BUILD_ID'
      - '--min=1'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  # 5. Automatically deploy the new image to news discovery Cloud Run job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-news-discovery'
      - '--memory=1Gi'
      - '--command=python'
      - '--args=-m,scripts.run_news_discovery,--discover,--pipeline,--scheduled,--limit,50'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  # Keep the independent expiry worker on the same API/model image.
  # Its existing database binding and minute scheduler are provisioned separately.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'lanes-zone-expiry'
      - '--memory=1Gi'
      - '--command=python'
      - '--args=-m,scripts.run_zone_expiry'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'

  # Promote the exact revision only after migration and both worker deploys pass.
  # Explicit promotion also clears traffic pinned by an earlier manual rollback.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'lanes-api'
      - '--to-revisions=lanes-api-build-$BUILD_ID=100'
      - '--region'
      - 'asia-east1'

images:
  - 'gcr.io/$PROJECT_ID/github.com/pu-roi/lanes:$COMMIT_SHA'
